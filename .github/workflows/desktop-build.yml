name: Desktop Build

# Builds unsigned desktop installers (.dmg / NSIS .exe / .AppImage) on native
# runners. Cross-building Windows/Linux from macOS is unreliable, so each
# target is built on its own OS via a matrix.
#
# Triggers:
#  - workflow_dispatch: a manual run that just produces installer artifacts.
#  - a v* tag push: builds AND publishes the installers to a draft GitHub
#    Release named for the tag. Review the draft, then publish it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Needed so a tagged build can create / update the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't cancel the other OS builds if one fails — we want every
      # installer that can be produced.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Project pins Node >=22.12 (.nvmrc / engines / engine-strict).
          node-version: 22

      - run: npm ci

      # electron-builder builds for the host OS (no platform flag):
      # .dmg on macOS, NSIS .exe on Windows, .AppImage on Linux.
      - name: Build installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist

      # On a v* tag, also publish the installers to a draft GitHub Release.
      - name: Build installers and publish draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installer-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn
          retention-days: 30
